en:{lang:"en",loc:"en-US",h1a:"Your",h1b:"Reminders",wait:"pending",doneN:"done",clear:"All clear for now",finish:"Done",snz:"Snooze 10m",del:"Delete",all:"All",today:"Today",doneF:"Done",
 e1:["No reminders yet","Tap + to create your first one."],e2:["Nothing today","No reminders are due today."],e3:["Nothing done yet","Reminders you complete show up here."],e4:["Nothing on this date","Tap + to add a reminder."],clr:"Show all",
 nw:"New reminder",ph:"What do you need to remember?",save:"Save reminder",rem:"Reminder",ec1:"No",ec2:"Reminders",nothing:"Nothing pending",enjoy:"Enjoy your day",later:"Snooze",time:"It’s time!",
 set:"Settings",blur:"Glass blur",model:"Card style",m:{stack:"Stack",slide:"Slide",grid:"Grid"},language:"Language",theme:"Color theme",modes:{auto:"Auto",light:"Light",dark:"Dark"},acc:"Accent color",
 wall:"Wallpaper",up:"Upload photo",reset:"Reset",close:"Close",w:{city:"City",sunset:"Sunset",sea:"Sea",forest:"Forest",aurora:"Aurora",plain:"Plain"},
 cats:{Pribadi:"Personal",Kerja:"Work",Kesehatan:"Health",Belanja:"Shopping"},now:"now",min:"min",hr:"h",day:"d",mn:"min",
 fut:u=>"in "+u,past:u=>u+" ago",add:"Add reminder",mk:"Mark done",un:"Mark not done",dl:"Delete reminder",rl:"Reminder: ",tl:"Reminder title",tm:"Reminder time"}};
const ACC={pearl:["#d9cfae","#3a3834"],ocean:["#9fc4ee","#1f5f9e"],rose:["#f0b8c8","#b23a66"],mint:["#a9dcc3","#1f7a57"],violet:["#c6b8f0","#5b45b5"]};
const WALL={
city:"radial-gradient(30% 18% at 22% 30%,rgba(255,255,255,.55),transparent 70%),radial-gradient(26% 16% at 85% 62%,rgba(255,236,205,.6),transparent 70%),repeating-linear-gradient(135deg,transparent 0 46px,rgba(255,255,255,.28) 46px 50px,rgba(90,70,50,.16) 50px 54px),linear-gradient(135deg,#1f5f9e 0%,#5f9bd3 28%,#e8dccb 52%,#c4b3a0 74%,#8b8d99 100%)",
sunset:"radial-gradient(40% 22% at 70% 70%,rgba(255,240,190,.7),transparent 70%),linear-gradient(160deg,#2b2a5c 0%,#8a4f8f 30%,#ee8a6b 62%,#ffd9a0 100%)",
sea:"radial-gradient(40% 25% at 30% 25%,rgba(255,255,255,.4),transparent 70%),linear-gradient(170deg,#0e6a86 0%,#2aa0a8 40%,#bfe6d8 75%,#f1ead6 100%)",
forest:"radial-gradient(35% 20% at 75% 25%,rgba(255,255,220,.45),transparent 70%),linear-gradient(160deg,#0f3b2b,#2f7a52 45%,#a8cf9a 80%,#efe6c4)",
aurora:"radial-gradient(50% 30% at 70% 20%,rgba(120,255,200,.6),transparent 70%),radial-gradient(40% 30% at 20% 60%,rgba(170,120,255,.6),transparent 70%),linear-gradient(180deg,#0d1030,#1d2a5a 60%,#3b2a6b)",
plain:"linear-gradient(180deg,#eceae6,#d6d4cf)"};
const P={check:"M5 12.5l4.5 4.5L19 7.5",plus:"M12 5v14M5 12h14",clock:"M12 7v5l3 2M12 21a9 9 0 100-18 9 9 0 000 18",trash:"M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12",bell:"M6 16v-5a6 6 0 0112 0v5l1.5 2h-15zM10 20h4",sliders:"M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6"};
const Ic=({n,s=22})=>html`<svg viewBox="0 0 24 24" width=${s} height=${s} fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d=${P[n]}/></svg>`;
const KEY="ingat.v1",CK="ingat.cfg";
const DEF={blur:6,model:"stack",lang:"id",mode:"auto",accent:"pearl",wall:"city",img:null};
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}};
const save=v=>{try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}};
const loadC=()=>{try{return{...DEF,...JSON.parse(localStorage.getItem(CK))}}catch(e){return DEF}};
const saveC=v=>{try{localStorage.setItem(CK,JSON.stringify(v))}catch(e){}};
function apply(c){const r=document.documentElement,s=r.style;
 s.setProperty("--blur",c.blur+"px");
 if(c.mode==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",c.mode);
 const a=ACC[c.accent]||ACC.pearl;s.setProperty("--acc",a[0]);s.setProperty("--acc2",a[1]);
 s.setProperty("--wall",c.wall==="custom"&&c.img?`url("${c.img}") center/cover no-repeat`:WALL[c.wall]||WALL.city);
 r.lang=c.lang}
const hm=(ms,t)=>new Date(ms).toLocaleTimeString(t.loc,{hour:"2-digit",minute:"2-digit"}).replace(".",":");
const dm=(ms,t)=>new Date(ms).toLocaleDateString(t.loc,{weekday:"short",day:"numeric",month:"short"});
const sameDay=(a,b)=>new Date(a).toDateString()===new Date(b).toDateString();
const rel=(at,now,t)=>{const m=Math.round((at-now)/6e4),a=Math.abs(m);if(m===0)return t.now;
 const u=a<60?a+" "+t.min:a<1440?Math.floor(a/60)+" "+t.hr+(a%60?" "+a%60+" "+t.mn:""):Math.floor(a/1440)+" "+t.day;
 return m<0?t.past(u):t.fut(u)};
const local=ms=>{const d=new Date(ms-new Date(ms).getTimezoneOffset()*6e4);return d.toISOString().slice(0,16)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const Chips=({c,set,k,opts})=>html`<div class="chips">${opts.map(([v,l])=>html`<button type="button" key=${v} class=${"chip"+(c[k]===v?" on":"")} onClick=${()=>set({[k]:v})}>${l}</button>`)}</div>`;

function Sheet({t,init,onClose,onSave}){
 const [title,setTitle]=useState("");
 const [at,setAt]=useState(local(init||Date.now()+36e5));
 const [cat,setCat]=useState("Pribadi");
 const ok=title.trim()&&at;
 return html`<div class="scrim" onClick=${e=>e.target===e.currentTarget&&onClose()}>
  <form class="sheet" onSubmit=${e=>{e.preventDefault();if(ok)onSave({id:uid(),title:title.trim(),at:new Date(at).getTime(),cat,done:false})}}>
   <h2>${t.nw}</h2>
   <input class="fld" autoFocus placeholder=${t.ph} value=${title} onInput=${e=>setTitle(e.target.value)} maxLength="90" aria-label=${t.tl}/>
   <input class="fld" type="datetime-local" value=${at} onInput=${e=>setAt(e.target.value)} aria-label=${t.tm}/>
   <div class="chips">${CATS.map(([c])=>html`<button type="button" key=${c} class=${"chip"+(cat===c?" on":"")} onClick=${()=>setCat(c)}>${t.cats[c]}</button>`)}</div>
   <button class="go" disabled=${!ok}>${t.save}</button>
  </form></div>`;
}

function Settings({c,set,t,onClose}){
 const pick=f=>{if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=im.width*k;cv.height=im.height*k;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);set({wall:"custom",img:cv.toDataURL("image/jpeg",.8)})};im.src=rd.result};rd.readAsDataURL(f)};
 return html`<div class="scrim nb" onClick=${e=>e.target===e.currentTarget&&onClose()}>
  <div class="sheet set" role="dialog" aria-label=${t.set}>
   <div class="hd"><h2>${t.set}</h2><button class="chip on" onClick=${onClose}>${t.close}</button></div>
   <div class="lb"><span>${t.blur}</span><b>${c.blur}px</b></div>
   <input class="rng" type="range" min="0" max="30" value=${c.blur} onInput=${e=>set({blur:+e.target.value})} aria-label=${t.blur}/>
   <div class="lb">${t.model}</div>
   <${Chips} c=${c} set=${set} k="model" opts=${Object.keys(t.m).map(k=>[k,t.m[k]])}/>
   <div class="lb">${t.language}</div>
   <${Chips} c=${c} set=${set} k="lang" opts=${[["id","Indonesia"],["en","English"]]}/>
   <div class="lb">${t.theme}</div>
   <${Chips} c=${c} set=${set} k="mode" opts=${Object.keys(t.modes).map(k=>[k,t.modes[k]])}/>
   <div class="lb">${t.acc}</div>
   <div class="sws">${Object.keys(ACC).map(k=>html`<button key=${k} class=${"sw"+(c.accent===k?" on":"")} aria-label=${k} style=${{background:`linear-gradient(135deg,${ACC[k][0]},${ACC[k][1]})`}} onClick=${()=>set({accent:k})}/>`)}</div>
   <div class="lb">${t.wall}</div>
   <div class="sws">
    ${Object.keys(WALL).map(k=>html`<button key=${k} class=${"wl"+(c.wall===k?" on":"")} aria-label=${t.w[k]} title=${t.w[k]} style=${{background:WALL[k],backgroundSize:"cover"}} onClick=${()=>set({wall:k})}/>`)}
    <label class=${"wl up"+(c.wall==="custom"?" on":"")} style=${c.img?{background:`url("${c.img}") center/cover`}:null}><input type="file" accept="image/*" hidden onChange=${e=>pick(e.target.files[0])}/>${c.img?"":t.up}</label>
   </div>
   <button class="go rs" onClick=${()=>set(DEF)}>${t.reset}</button>
  </div></div>`;
}

const CC={Pribadi:"#e3a92f",Kerja:"#3f7fe0",Kesehatan:"#e5547a",Belanja:"#2fae77"};
function Cal({items,now,t,day,setDay}){
 const [mo,setMo]=useState(()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1)});
 const [dir,setDir]=useState(1);
 const ref=useRef();
 const go=k=>{setDir(k);setMo(new Date(mo.getFullYear(),mo.getMonth()+k,1))};
 const first=(mo.getDay()+6)%7,dim=new Date(mo.getFullYear(),mo.getMonth()+1,0).getDate();
 const key=d=>d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();
 const by={};items.forEach(r=>{const k=key(new Date(r.at));(by[k]=by[k]||[]).push(r)});
 const cells=[];for(let i=0;i<first;i++)cells.push(null);for(let d=1;d<=dim;d++)cells.push(new Date(mo.getFullYear(),mo.getMonth(),d));
 const tk=key(new Date(now)),sk=day?key(new Date(day)):"";
 const tilt=(x,y)=>{const e=ref.current;if(e){e.style.setProperty("--ry",x+"deg");e.style.setProperty("--rx",y+"deg")}};
 const mv=e=>{const b=e.currentTarget.getBoundingClientRect();tilt(((e.clientX-b.left)/b.width-.5)*14,-((e.clientY-b.top)/b.height-.5)*12)};
 return html`<section class="cal" onPointerMove=${mv} onPointerLeave=${()=>tilt(0,0)}>
  <div class="ch"><button aria-label="‹" onClick=${()=>go(-1)}><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
   <h3>${mo.toLocaleDateString(t.loc,{month:"long",year:"numeric"})}</h3>
   <button aria-label="›" onClick=${()=>go(1)}><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M9 5l7 7-7 7"/></svg></button></div>
  <div class="cb" ref=${ref}>
   <div class="wd">${[0,1,2,3,4,5,6].map(i=>html`<span key=${i}>${new Date(2024,0,1+i).toLocaleDateString(t.loc,{weekday:"short"}).slice(0,3)}</span>`)}</div>
   <div class=${"mg "+(dir>0?"nx":"pv")} key=${mo.getTime()}>
    ${cells.map((d,i)=>{if(!d)return html`<span key=${"e"+i}/>`;
     const k=key(d),rs=by[k]||[],pend=rs.filter(r=>!r.done);
     const cls="cell"+(k===tk?" now":"")+(k===sk?" sel":"")+(pend.length?" has":rs.length?" fin":"");
     return html`<button key=${k} class=${cls} onClick=${()=>setDay(k===sk?null:d.getTime())} aria-label=${d.toLocaleDateString(t.loc,{dateStyle:"full"})+(rs.length?" ("+rs.length+")":"")}>
      <span class="num">${d.getDate()}</span>
      <span class="dots">${pend.slice(0,3).map((r,j)=>html`<i key=${r.id} style=${{"--c":CC[r.cat]||CC.Pribadi,"--j":j}}/>`)}</span>
      ${pend.length>3&&html`<em>+${pend.length-3}</em>`}
     </button>`})}
   </div>
  </div>
  ${day?html`<div class="cf"><span>${new Date(day).toLocaleDateString(t.loc,{weekday:"long",day:"numeric",month:"long"})}</span><button onClick=${()=>setDay(null)}>${t.clr}</button></div>`:html`<div class="lgd">${Object.keys(CC).map(k=>html`<span key=${k} style=${{"--c":CC[k]}}><i/>${t.cats[k]}</span>`)}</div>`}
 </section>`;
}
function App(){
 const [items,setItems]=useState(load);
 const [c,setC]=useState(loadC);
 const [now,setNow]=useState(Date.now());
 const [sel,setSel]=useState(0);
 const [filter,setFilter]=useState("all");
 const [sheet,setSheet]=useState(false);
 const [cfg,setCfg]=useState(false);
 const [day,setDay]=useState(null);
 const [toast,setToast]=useState(null);
 const fired=useRef(new Set());
 const t=T[c.lang]||T.id;
 const set=p=>setC(v=>({...v,...p}));
 useEffect(()=>{apply(c);saveC(c)},[c]);
 useEffect(()=>{save(items)},[items]);
 useEffect(()=>{const i=setInterval(()=>setNow(Date.now()),15000);return()=>clearInterval(i)},[]);
 useEffect(()=>{items.forEach(r=>{const k=r.id+":"+r.at;
  if(r.done||r.at>now||fired.current.has(k))return;
  fired.current.add(k);
  if(now-r.at<3e5){setToast(r);try{if("Notification" in window&&Notification.permission==="granted")new Notification(t.time,{body:r.title})}catch(e){}}
 })},[now,items]);
 const up=items.filter(r=>!r.done).sort((a,b)=>a.at-b.at);
 const fl=c.model!=="stack";
 const shown=up.slice(0,fl?12:5),n=shown.length,s=Math.min(sel,Math.max(n-1,0)),cur=shown[s];
 const patch=(id,f)=>setItems(v=>v.map(r=>r.id===id?{...r,...f}:r));
 const finish=id=>{patch(id,{done:true});setToast(null)};
 const snooze=id=>{patch(id,{at:Date.now()+6e5});setToast(null)};
 const remove=id=>setItems(v=>v.filter(r=>r.id!==id));
 const base=filter==="done"?items.filter(r=>r.done).sort((a,b)=>b.at-a.at):filter==="today"?up.filter(r=>sameDay(r.at,now)):up;
 const ask=()=>{try{if("Notification" in window&&Notification.permission==="default")Notification.requestPermission()}catch(e){}};
 const list=day?items.filter(r=>sameDay(r.at,day)).sort((a,b)=>a.at-b.at):base;
 const msg=day?t.e4:{all:t.e1,today:t.e2,done:t.e3}[filter];
 const ndone=items.filter(r=>r.done).length;
 return html`<main class="app">
  <div class="top"><span>${hm(now,t)}</span><span class="logo">ingat</span><button class="avatar" aria-label=${t.set} onClick=${()=>setCfg(true)}><${Ic} n="sliders" s=${18}/></button></div>
  <h1>${t.h1a}<br/>${t.h1b}</h1>
  <p class="sub">${n?up.length+" "+t.wait+" · "+ndone+" "+t.doneN:t.clear}</p>
  <div class=${"stack"+(fl?" fl "+c.model:"")}>
   ${n===0?html`<div class=${"card"+(fl?" fl":"")} style=${{"--t":"#d9cfae"}}><div class="r"><span class="cat">${t.ec1} <i>${t.ec2}</i></span></div><div class="ttl">${t.nothing}</div><div class="rel">${t.enjoy}</div></div>`
   :shown.map((r,i)=>{const d=(i-s+n)%n;const late=r.at<now;
    return html`<button key=${r.id} class=${"card"+(fl?" fl":"")+(fl&&i===s?" sel":"")} onClick=${()=>setSel(i)} aria-label=${t.rl+r.title} style=${fl?{"--t":tint(r.cat)}:{"--t":tint(r.cat),zIndex:n-d,opacity:d>3?0:1-d*.12,transform:`translateX(${d*30}px) translateY(${-d*7}px) rotate(${d*2.4}deg) scale(${1-d*.055})`}}>
     <div class="r"><span class="cat">${t.cats[r.cat]||r.cat} <i>${t.rem}</i></span><span class="t">${hm(r.at,t)}</span></div>
     <div class="ttl">${r.title}</div>
     <div class="r"><span class=${"rel"+(late?" late":"")}>${rel(r.at,now,t)}</span><span class="dt">${dm(r.at,t)}</span></div>
    </button>`})}
  </div>
  <div class="acts">
   <button class="act" disabled=${!cur} onClick=${()=>cur&&finish(cur.id)}><span class="ring"><${Ic} n="check"/></span>${t.finish}</button>
   <button class="act" disabled=${!cur} onClick=${()=>cur&&snooze(cur.id)}><span class="ring"><${Ic} n="clock"/></span>${t.snz}</button>
   <button class="act" disabled=${!cur} onClick=${()=>cur&&remove(cur.id)}><span class="ring"><${Ic} n="trash"/></span>${t.del}</button>
  </div>
  <${Cal} items=${items} now=${now} t=${t} day=${day} setDay=${setDay}/>
  <section class="panel" aria-live="polite">
   ${list.length===0?html`<div class="empty"><b>${msg[0]}</b>${msg[1]}</div>`:list.map(r=>html`
    <div key=${r.id} class=${"row"+(r.done?" done":"")}>
     <button class="chk" aria-label=${r.done?t.un:t.mk} onClick=${()=>patch(r.id,{done:!r.done})}><${Ic} n="check" s=${15}/></button>
     <div class="rb"><div class="rt">${r.title}</div><div class=${"rm"+(!r.done&&r.at<now?" late":"")}>${t.cats[r.cat]||r.cat} · ${dm(r.at,t)}, ${hm(r.at,t)}</div></div>
     <button class="del" aria-label=${t.dl} onClick=${()=>remove(r.id)}><${Ic} n="trash" s=${18}/></button>
    </div>`)}
  </section>
  <nav class="bar" aria-label="Filter">
   ${[["all",t.all],["today",t.today],["done",t.doneF]].map(([k,l])=>html`<button key=${k} class=${"pill"+(filter===k?" on":"")} onClick=${()=>{setFilter(k);setDay(null)}}>${l}</button>`)}
   <button class="add" aria-label=${t.add} onClick=${()=>{ask();setSheet(true)}}><${Ic} n="plus"/></button>
  </nav>
  ${sheet&&html`<${Sheet} t=${t} init=${day?new Date(new Date(day).setHours(9,0,0,0)).getTime():null} onClose=${()=>setSheet(false)} onSave=${r=>{setItems(v=>[...v,r]);setSheet(false);setSel(0)}}/>`}
  ${cfg&&html`<${Settings} c=${c} set=${set} t=${t} onClose=${()=>setCfg(false)}/>`}
  ${toast&&html`<div class="toast" role="alert"><span class="ring" style=${{width:42,height:42}}><${Ic} n="bell" s=${18}/></span><div class="rt">${toast.title}</div><button onClick=${()=>snooze(toast.id)}>${t.later}</button><button onClick=${()=>finish(toast.id)}>${t.finish}</button></div>`}
 </main>`;
}
apply(loadC());
if(navigator.userAgentData)document.documentElement.classList.add("cr");
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
